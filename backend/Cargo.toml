[workspace]
resolver = "2"
members = ["api"]

[workspace.dependencies]
ahara-lambda-http = { git = "https://github.com/chris-arsenault/ahara-infra.git", package = "ahara-lambda-http" }
ahara-lambda-telemetry = { git = "https://github.com/chris-arsenault/ahara-infra.git", package = "ahara-lambda-telemetry" }
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1"
base64 = "0.22"
lambda_http = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time"] }
testcontainers-modules = { version = "0.13", features = ["postgres"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
